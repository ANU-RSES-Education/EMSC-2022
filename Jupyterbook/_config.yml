# Book settings
title: EMSC 2022
author: David Heslop, Meghan Miller, Voon Hui Lai, Louis Moresi
logo: Figures/AuWorldEQ.jpg
exclude_patterns: ["README.md", "Notes/*", "Scripts/*, */ScratchPad/*", "Lectures/*reveal.md"]

latex:
  latex_documents:
    targetname: EMSC2022.tex

html:
#  home_page_in_navbar option: true
  extra_navbar: <button type="button" onclick="legibleFontSwitcher()">Switch Font</button>&nbsp;&nbsp;<button type="button" onclick="fontScaler(1.1)">&#10133;</button><button type="button" onclick="fontScaler(0.0)">&#9679;</button><button type="button" onclick="fontScaler(0.909)">&#10134;</button>
  use_repository_button: true
  comments:
    hypothesis: true
  # Rewrites Jupyter Book's per-page Binder "rocket" URLs from plain
  # `{hub}/v2/gh/owner/repo/branch?urlpath=lab/tree/{path}` (which would 404
  # against a generic image that doesn't bake in this course's notebooks)
  # to the nbgitpuller form
  # `{hub}/v2/gh/{launcher}/{branch}?urlpath=git-pull%3Frepo=...%26urlpath=...%26branch=...`
  # which pulls the current notebook content at launch time.
  # If JS is disabled the original rocket URL remains as a harmless fallback.
  extra_footer: |
    <script>
    (function () {
      // ---- Configure for this course ----
      // LAUNCHER points at the generic ANU-RSES launcher repo (a few-KB
      // .binder/Dockerfile that just FROMs the shared GHCR image).
      // mybinder.org caches by *that* repo's commit hash, so launches don't
      // pay to re-clone EMSC-2022's hundreds-of-MB content tree every time.
      const LAUNCHER   = "https://mybinder.org/v2/gh/ANU-RSES-Education/binder-launcher/main";
      const CONTENT    = "https://github.com/ANU-RSES-Education/EMSC-2022";
      const BRANCH     = "master";
      const REPO_DIR   = "EMSC-2022";  // directory name nbgitpuller clones into
      // -----------------------------------
      function rewrite() {
        document.querySelectorAll('a[href*="mybinder.org/v2/gh"]').forEach(function (a) {
          var href = a.getAttribute("href") || "";
          if (href.indexOf("urlpath=git-pull") !== -1) return;  // already nbgitpuller
          var m = href.match(/[?&]urlpath=(?:lab\/tree\/|tree\/)([^&#]+)/);
          if (!m) return;
          var nbPath = decodeURIComponent(m[1]);
          var inner  = "repo="    + encodeURIComponent(CONTENT)
                     + "&urlpath=" + encodeURIComponent("lab/tree/" + REPO_DIR + "/" + nbPath)
                     + "&branch="  + BRANCH;
          a.setAttribute("href",
            LAUNCHER + "?urlpath=" + encodeURIComponent("git-pull?" + inner));
          a.setAttribute("title", "Launch on Binder (nbgitpuller — pulls latest)");
        });
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", rewrite);
      } else {
        rewrite();
      }
    })();
    </script>

# Parse and render settings
parse:
  myst_enable_extensions:  # default extensions to enable in the myst parser. See https://myst-parser.readthedocs.io/en/latest/using/syntax-optional.html
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    # - html_admonition
    - html_image
    - linkify
    # - replacements
    # - smartquotes
    - substitution

sphinx:
  config:
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    html_extra_path: ['Lectures/static_slides']
    bibtex_reference_style: author_year

    myst_enable_extensions: 
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution


repository:
  url         : https://github.com/ANU-RSES-Education/EMSC-2022  # Online location of this book
  # branch      : master  # Which branch of the repository should be used when creating links (optional)

launch_buttons:
  binderhub_url:  "https://mybinder.org"
  notebook_interface: "jupyterlab"
  # The HTML rocket icons generated from this config emit plain Binder URLs
  # that would 404 against our generic (no-content-baked-in) image. The JS
  # in `html.extra_footer` above rewrites them in-place to nbgitpuller form
  # at page load so each one pulls the current notebook content for that page.


execute:
  # exclude_patterns:
  #   - File.ipynb

  allow_errors : true # If `False`, when a code cell raises an error the execution is stopped, otherwise all cells are always run.
  timeout: 240

  execute_notebooks: false
  # cache: .jupyter-cache 

  bibtex_bibfiles:
   - JupyterBook.bib
