name: Build Binder image

# Builds .binder/Dockerfile.source and publishes it to
# ghcr.io/anu-rses-education/emsc-2022. Binder reads .binder/Dockerfile
# (a tiny `FROM` pointing at this image), so mybinder.org just pulls the
# pre-built image — no solver, no apt, no OOM-kills on shared infra.

on:
  push:
    branches: [master]
    paths:
      - .binder/**
      - .github/workflows/build-binder-image.yml
  workflow_dispatch:

# So multiple rapid pushes don't waste CI minutes racing each other.
concurrency:
  group: binder-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .binder
          file: .binder/Dockerfile.source
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
